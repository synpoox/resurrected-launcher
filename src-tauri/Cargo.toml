[package]
name = "resurrected-launcher"
version = "0.1.0"
description = "Launcher for the Project Resurrected mods"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and bin build artifacts.
name = "resurrected_launcher_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
