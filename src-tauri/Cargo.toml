[package]
name = "resurrected-launcher"
version = "0.1.3"
description = "Shared launcher for the project mods"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and bin build artifacts.
name = "resurrected_launcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
# Native folder picker for choose_game_location (#60); Rust side only, no JS permission.
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5.5"
# Signed launcher self-updates (#88, ADR 0003). No zip: the NSIS installer is served as is.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"] }
# HTTPS archive download (#35); ring keeps the Windows build free of cmake/nasm.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
# The first-close toast (#104), called directly so its error is seen.
tauri-winrt-notification = "0.8.1"
# WebView2 settings Tauri does not expose (#185); the versions wry already uses.
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
base64 = "0.22"
# Ephemeral updater signing keys, generated in a temp dir by the self-update tests.
minisign = "0.10.0"
# Local TLS fixture server for download tests.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Connection-reset injection in the fixture HTTP server (tests/support).
socket2 = "0.6"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
