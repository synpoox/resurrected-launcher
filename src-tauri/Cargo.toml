[package]
name = "resurrected-launcher"
version = "0.1.0"
description = "Shared launcher for the project mods"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and bin build artifacts.
name = "resurrected_launcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
# HTTPS archive download (#35); ring keeps the Windows build free of cmake/nasm.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Local TLS fixture server for download tests.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
