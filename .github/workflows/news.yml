# Publishes news/news.json as the news.json asset of the mutable `catalog`
# release (#167). See docs/specs/news-feed.md. Edit the file on GitHub and
# commit to main; this checks it against news/news.schema.json, then uploads it.
# It touches no other release and never marks `catalog` as latest.
name: Publish news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - news/news.json

permissions:
  contents: read

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  # Checks news/news.json against news/news.schema.json (which mirrors the
  # launcher's News::parse) and the 64 KB size cap, in seconds rather than a
  # Rust build. PR CI still runs the parser test on the same file.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate news.json
        run: |
          test "$(stat -c %s news/news.json)" -le 65536
          python -c "import json,jsonschema; jsonschema.validate(json.load(open('news/news.json',encoding='utf-8')), json.load(open('news/news.schema.json')), format_checker=jsonschema.FormatChecker())"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upload news.json to the catalog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
          gh release upload catalog news/news.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release download catalog --pattern news.json --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          cmp news/news.json "$RUNNER_TEMP/news.json"
