# Signed launcher build (slice 5). See docs/release/launcher-signing.md.
#
# This builds the NSIS installer, its updater signature and latest.json, and
# uploads them as workflow artifacts. It never creates or publishes a GitHub
# release. With no signing key in the launcher-release environment, the build
# job is skipped and the run still succeeds.
#
# Every build has self-update on (VITE_SELF_UPDATE=1; #157, after the #89 gate).
# A tag launcher-v<version>-gate makes a slice 5 gate build (#89): the updater
# endpoint on 127.0.0.1 from src-tauri/gate/tauri.gate.conf.json. Same key.
# Never distribute a gate build. Every other trigger builds the release launcher
# with the shipped config.
name: Launcher release

on:
  workflow_dispatch:
  push:
    tags: ["launcher-v*"]
  pull_request:
    paths:
      - .github/workflows/**
      - docs/release/**

permissions:
  contents: read

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # Runs on every trigger and needs no secrets.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint (pinned, hash-checked)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Every secret this workflow reads is documented
        run: |
          doc=docs/release/launcher-signing.md
          names=$(grep -o 'secrets\.[A-Z_][A-Z0-9_]*' .github/workflows/release.yml | sed 's/^secrets\.//' | sort -u)
          [ -n "$names" ] || { echo "::error::no secrets found in release.yml"; exit 1; }
          missing=0
          for name in $names; do
            if ! grep -q "\`$name\`" "$doc"; then
              echo "::error file=$doc::secret $name is not listed"
              missing=1
            fi
          done
          exit "$missing"

  # Reports whether the signing key is configured, without exposing it.
  signing-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: launcher-release
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - id: check
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing secrets are not configured in the launcher-release environment; skipping the signed build. See docs/release/launcher-signing.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [lint, signing-gate]
    if: needs.signing-gate.outputs.signed == 'true'
    runs-on: windows-latest
    environment: launcher-release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the launcher version
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $gate = $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -eq "launcher-v$version-gate"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not $gate -and $env:GITHUB_REF_NAME -ne "launcher-v$version") {
            Write-Output "::error::Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version $version (expected launcher-v$version, or launcher-v$version-gate for a gate build)."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "gate=$($gate.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($gate) { Write-Output "::notice::Slice 5 gate build: updater endpoint 127.0.0.1. Never distribute it." }
      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The key is passed only to this step. tauri.conf.json sets
      # bundle.createUpdaterArtifacts, so the build writes the .sig.
      # VITE_SELF_UPDATE=1 for every build (#157). Gate builds only: the gate config
      # merged over tauri.conf.json (endpoint only; the key stays).
      - name: Build the signed NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GATE: ${{ steps.version.outputs.gate }}
          VITE_SELF_UPDATE: '1'
        run: |
          if ($env:GATE -eq 'true') {
            npx tauri build --ci --config "$env:GITHUB_WORKSPACE/src-tauri/gate/tauri.gate.conf.json"
          } else {
            npx tauri build --ci
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GATE: ${{ steps.version.outputs.gate }}
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $setup = @(Get-ChildItem $dir -Filter "*_${env:VERSION}_x64-setup.exe")
          if ($setup.Count -ne 1) { Write-Output "::error::Expected one installer in $dir, found $($setup.Count)."; exit 1 }
          $sig = "$($setup[0].FullName).sig"
          if (-not (Test-Path $sig)) { Write-Output "::error::Missing updater signature $sig."; exit 1 }
          # productName "Project Resurrected" has a space; GitHub would rename the
          # uploaded asset (space to dot) and break the latest.json URL (#151).
          $name = $setup[0].Name -replace ' ', '-'
          if ($name -ne $setup[0].Name) {
            Move-Item -LiteralPath $sig -Destination "$dir/$name.sig"
            Move-Item -LiteralPath $setup[0].FullName -Destination "$dir/$name"
            $sig = "$dir/$name.sig"
          }
          $tag = "launcher-v$env:VERSION"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
          # Gate builds update from src-tauri/gate/serve-update.ps1 on this machine.
          if ($env:GATE -eq 'true') { $url = "http://127.0.0.1:8789/$name" }
          # What's new after a self-update (#189): docs/release/notes/<version>.md
          # (Markdown subset, as in product patch notes) becomes latest.json's notes.
          # With no file, the notes are empty and the launcher shows no dialog.
          $notesFile = "docs/release/notes/$env:VERSION.md"
          $notes = if (Test-Path -LiteralPath $notesFile) { (Get-Content -LiteralPath $notesFile -Raw -Encoding utf8).Trim() } else { "" }
          $latest = [ordered]@{
            version  = $env:VERSION
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = $url
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$dir/latest.json"
          Get-FileHash "$dir/*" -Algorithm SHA256 | Format-Table -AutoSize Hash, Path
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-${{ steps.version.outputs.version }}${{ steps.version.outputs.gate == 'true' && '-gate' || '' }}-unpublished
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 14
